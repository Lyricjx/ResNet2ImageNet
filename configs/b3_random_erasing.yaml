run:
  data_root: data/imagenet_10pct
  output_dir: runs/resnet18_b3_random_erasing_seed16
  epochs: 90
  batch_size: 256
  workers: 8
  seed: 16
  resume: ""

optimizer:
  name: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0001

scheduler:
  name: multistep
  milestones: []
  gamma: 0.1

augmentation:
  name: random_erasing
  crop_scale: [0.08, 1.0]
  crop_ratio: [0.75, 1.3333333333333333]
  horizontal_flip: 0.5
  p: 0.25
  scale: [0.02, 0.20]
  ratio: [0.3, 3.3]
  value: 0

loss:
  name: cross_entropy

model:
  name: resnet18
