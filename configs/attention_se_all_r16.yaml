# D1: add SE to all eight BasicBlocks, reduction ratio 16.
run:
  data_root: data/imagenet_10pct
  output_dir: runs/attention_se_all_r16_seed16
  epochs: 90
  batch_size: 256
  workers: 8
  seed: 16
  resume: ""

optimizer:
  name: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0001

scheduler:
  name: multistep
  milestones: []
  gamma: 0.1

augmentation:
  name: basic
  crop_scale: [0.08, 1.0]
  crop_ratio: [0.75, 1.3333333333333333]
  horizontal_flip: 0.5

loss:
  name: cross_entropy

model:
  name: resnet18_se
  reduction: 16
  stages: [layer1, layer2, layer3, layer4]
